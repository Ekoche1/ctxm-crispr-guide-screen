[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxm-screen"
version = "1.0.0"
description = "In-silico screen of Cas12a target sequences in blaCTX-M-15"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Victor Ekoche" }]
dependencies = ["biopython", "numpy", "pandas", "matplotlib", "regex"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
